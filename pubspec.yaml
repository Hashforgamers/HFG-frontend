flutter_icons:
  android: true
  ios: true
  image_path: "assets/app_icon.png" # Path to your app icon

# Flavor-specific configurations
flutter_flavorizr:
  flavors:
    dev:
      app:
        name: "Hash Dev"
      android:
        applicationId: "com.hfg.hash.dev"
      ios:
        bundleId: "com.hfg.hash.dev"
    prod:
      app:
        name: "Hash"
      android:
        applicationId: "com.hfg.hash"
      ios:
        bundleId: "com.hfg.hash"

