org.gradle.jvmargs=-Xmx6g -XX:MaxMetaspaceSize=1g -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8

android.useAndroidX=true
android.enableJetifier=false

org.gradle.parallel=false
org.gradle.configureondemand=true

kotlin.incremental=false
kotlin.incremental.useClasspathSnapshot=false

# Firebase Performance's Gradle plugin rewrites every library's bytecode,
# including the huge Flutter engine jars, and ran Codemagic out of heap
# (AsmClassesTransform: Java heap space). Its auto network traces only cover
# native Android HTTP stacks, not Dart's dio/http, so nothing is lost; the
# firebase_performance Dart SDK still works.
firebasePerformanceInstrumentationEnabled=false
