<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <title>Road Rumble</title>
    <!--
      The 3D world for Road Rumble. This page only draws: the Flutter screen
      owns the race simulation, HUD, controls and sound, and drives this page
      through window.RR:
        RR.load(track)  once per race, with the road and its scenery
        RR.frame(state) every tick, with where everyone is
        RR.attract()    idle fly-along, used behind the menus
      Opened on its own (no Flutter), it runs the fly-along over a made-up road.
      Libraries and the sky are shared with ../super_over (see its ASSETS.md).
    -->
    <style>
      html, body { margin: 0; height: 100%; background: #0c0816; overflow: hidden; }
      canvas { display: block; width: 100%; height: 100%; touch-action: none; }
    </style>
    <script type="importmap">
      { "imports": { "three": "../super_over/lib/three.module.min.js", "three/addons/": "../super_over/lib/jsm/" } }
    </script>
  </head>
  <body>
    <script type="module">
      import * as THREE from "three";
      import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
      import { RGBELoader } from "three/addons/loaders/RGBELoader.js";

      // ------------------------------------------------------------ scale
      // The simulation works in its own units; the scene is in metres.
      const U = 1 / 416;
      const SEG = 200 * U;            // length of one road segment
      const HALF = 3200 * U;          // half the road's width
      const TURN = 0.0014;            // radians of heading per unit of curve
      const EYE = 1.5;
      const TAU = Math.PI * 2;

      const THEMES = {
        forest: { ground: "forest_ground_04", wash: 0xd8ffc8, grass: 0x4f7f3a, verge: 0x7a6a48, fog: 0xb9cfe6, banks: 6.2, trees: ["pine", "pine", "pine", "bush", "rock"] },
        coast: { ground: "coast_sand_01", wash: 0xffffff, grass: 0xc9b47c, verge: 0xa8935e, fog: 0xcfe6f4, banks: 2.2, trees: ["palm", "palm", "bush", "rock"] },
        desert: { ground: "coast_sand_01", wash: 0xffd0a0, grass: 0xb07a4c, verge: 0xb89662, fog: 0xe8d8b8, banks: 3.6, trees: ["cactus", "cactus", "rock", "bush"] },
        valley: { ground: "forest_ground_04", wash: 0xc8ffa0, grass: 0x5f9a3c, verge: 0x8a7a4c, fog: 0xc4dff2, banks: 7.6, trees: ["oak", "oak", "bush", "pine"] },
        peaks: { ground: "rocks_ground_01", wash: 0xf0f4f0, grass: 0x66785a, verge: 0x7c7c74, fog: 0xa9c0e0, banks: 10, trees: ["pine", "rock", "rock", "pine", "bush"] },
      };
      // Jacket and helmet colours; 0 is the player, 15 the police.
      const LOOKS = [
        [0x3a3a44, 0xd8b43c], [0xb84038, 0xe8e8ec], [0x8a4aa8, 0xd878a8], [0x667840, 0x484e3c],
        [0x3a9a62, 0x2c2c32], [0x9a7040, 0xccc4ac], [0xd0d0d8, 0xb83430], [0xd08030, 0x34343c],
        [0x44444e, 0x74302e], [0x3a9aa8, 0xd8b43c], [0x4a58b8, 0x4a58b8], [0xd0608a, 0xb8c440],
        [0x6e6e76, 0x8ab84a], [0xa03432, 0xa03432], [0xbcaa36, 0x3a54a8], [0x24346c, 0xf4f4f8],
      ];
      const CAR_PAINT = [0xa8322c, 0x2f4f9a, 0xd8d8d2, 0x2f7f76];

      // --------------------------------------------------------- renderer
      const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
      // Phones get a lighter budget: fewer pixels, cheaper shadows.
      const PHONE = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent) || new URLSearchParams(location.search).has("phone");
      renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = 0.95;
      // A shadow map costs a phone a third of its frame rate; there, each
      // vehicle sits on a soft dark patch instead.
      renderer.shadowMap.enabled = !PHONE;
      renderer.shadowMap.type = PHONE ? THREE.PCFShadowMap : THREE.PCFSoftShadowMap;
      document.body.appendChild(renderer.domElement);
      const ANISO = Math.min(renderer.capabilities.getMaxAnisotropy(), PHONE ? 4 : 16);

      const scene = new THREE.Scene();
      scene.background = new THREE.Color(0x9fc3ea);
      // Only the stretch of road within sight is drawn; fog hides its end.
      const SIGHT = PHONE ? 760 : 1100;   // segments ahead of the camera
      const NEAR = PHONE ? 45 : 150;      // segments within which scenery is drawn in full detail
      const BEHIND = 40;
      const SHADE = PHONE ? 60 : 0;       // segments within which scenery casts shadows (0: all of it)
      const MID = PHONE ? 80 : 400;       // segments past which scanned scenery gives way to a rough shape
      // The detailed bikes are ~75k triangles each, so few riders get one.
      const HI_BIKES = PHONE ? 0 : 6, HI_REACH = PHONE ? 5000 : 9000;
      scene.fog = new THREE.Fog(0xb9cfe6, SIGHT * 0.12, SIGHT * 0.46);
      const camera = new THREE.PerspectiveCamera(64, 1, 0.3, SIGHT * 0.5);

      const sun = new THREE.DirectionalLight(0xfff2dc, 3.1);
      sun.castShadow = !PHONE;
      sun.shadow.mapSize.set(PHONE ? 1024 : 2048, PHONE ? 1024 : 2048);
      sun.shadow.bias = -0.0004;
      sun.shadow.normalBias = 0.04;
      const sc = sun.shadow.camera;
      const reach = PHONE ? 26 : 46;
      sc.left = -reach; sc.right = reach; sc.top = reach; sc.bottom = -reach; sc.near = 1; sc.far = 260;
      scene.add(sun, sun.target, camera);
      scene.add(new THREE.HemisphereLight(0xcfe2ff, 0x5a5444, 0.55));

      new RGBELoader().load("../super_over/sky/kloofendal_puresky_1k.hdr", (hdr) => {
        hdr.mapping = THREE.EquirectangularReflectionMapping;
        scene.background = hdr;
        scene.environment = hdr;
        scene.environmentIntensity = 1.0;
      });

      function resize() {
        const w = window.innerWidth, h = window.innerHeight;
        renderer.setSize(w, h, false);
        camera.aspect = w / h;
        camera.updateProjectionMatrix();
      }
      window.addEventListener("resize", resize);
      resize();

      // Foliage sways: vertices are pushed sideways by height, each
      // instance out of step with its neighbours.
      const wind = { value: 0 };
      function sway(material, amount) {
        material.onBeforeCompile = (shader) => {
          shader.uniforms.uWind = wind;
          shader.vertexShader = "uniform float uWind;\n" + shader.vertexShader.replace(
            "#include <begin_vertex>",
            `#include <begin_vertex>
             #ifdef USE_INSTANCING
               float phase = instanceMatrix[3].x * 0.37 + instanceMatrix[3].z * 0.23;
             #else
               float phase = 0.0;
             #endif
             float bend = max(position.y, 0.0) * ${amount.toFixed(4)};
             transformed.x += sin(uWind * 1.7 + phase + position.y * 0.5) * bend;
             transformed.z += cos(uWind * 1.3 + phase * 1.3) * bend * 0.6;`,
          );
        };
        return material;
      }
      // Leaves overlap many deep, and on a phone the full surface model
      // costs more per layer than the GPU has: there they are plainly lit,
      // with a little of their own colour let through so the shaded side isn't black.
      const plain = {};
      const leafy = (m) => (PHONE ? (plain[m.uuid] ||= new THREE.MeshLambertMaterial({ name: m.name, map: m.map, color: m.color, side: m.side, alphaTest: m.alphaTest, emissive: 0x343434, emissiveMap: m.map })) : m);

      // --------------------------------------------------------- textures
      function rng(seed) {
        let s = seed >>> 0;
        return () => ((s = (s * 1664525 + 1013904223) >>> 0) / 4294967296);
      }
      function canvasTexture(w, h, draw, repeatX = 1, repeatY = 1, colour = true) {
        const c = document.createElement("canvas");
        c.width = w; c.height = h;
        draw(c.getContext("2d"), w, h);
        const t = new THREE.CanvasTexture(c);
        t.wrapS = t.wrapT = THREE.RepeatWrapping;
        t.repeat.set(repeatX, repeatY);
        t.anisotropy = ANISO;
        if (colour) t.colorSpace = THREE.SRGBColorSpace;
        return t;
      }
      function speckle(g, w, h, count, r, shades) {
        for (let i = 0; i < count; i++) {
          g.fillStyle = shades[(r() * shades.length) | 0];
          const s = 1 + r() * 2.5;
          g.fillRect(r() * w, r() * h, s, s);
        }
      }
      // Scanned surfaces from Poly Haven (CC0): colour, normal, and a packed
      // occlusion/roughness/metal map each.
      const scans = {};
      const textures = new THREE.TextureLoader();
      function scan(name, repeatX = 1, repeatY = 1) {
        const key = `${name}|${repeatX}|${repeatY}`;
        if (scans[key]) return scans[key];
        const one = (suffix, colour) => {
          const t = textures.load(`tex/${name}_${suffix}.jpg`);
          t.wrapS = t.wrapT = THREE.RepeatWrapping;
          t.repeat.set(repeatX, repeatY);
          t.anisotropy = ANISO;
          if (colour) t.colorSpace = THREE.SRGBColorSpace;
          return t;
        };
        const arm = one("arm", false);
        return (scans[key] = { map: one("diff", true), normalMap: one("nor_gl", false), aoMap: arm, roughnessMap: arm, roughness: 1, metalness: 0 });
      }

      // The road markings, painted on a clear sheet laid over the tarmac: four lanes, double yellow
      // centre, solid white edges. One tile is 12 segments long.
      const roadMap = canvasTexture(1024, 1024, (g, w, h) => {
        const r = rng(7);
        g.clearRect(0, 0, w, h);
        // Wheel tracks and tar seams.
        for (const lane of [0.125, 0.375, 0.625, 0.875]) {
          g.fillStyle = "rgba(20,20,22,0.16)";
          g.fillRect(lane * w - 34, 0, 26, h); g.fillRect(lane * w + 8, 0, 26, h);
        }
        g.strokeStyle = "rgba(18,18,20,0.5)"; g.lineWidth = 2;
        for (let i = 0; i < 7; i++) {
          g.beginPath(); let x = r() * w, y = r() * h; g.moveTo(x, y);
          for (let k = 0; k < 6; k++) { x += (r() - 0.5) * 70; y += r() * 60; g.lineTo(x, y); }
          g.stroke();
        }
        const paint = (x, wide, colour, dashed) => {
          g.fillStyle = colour;
          if (dashed) { g.fillRect(x - wide / 2, 0, wide, h * 0.42); } else { g.fillRect(x - wide / 2, 0, wide, h); }
        };
        paint(w * 0.03, 12, "#e6e6e0"); paint(w * 0.97, 12, "#e6e6e0");
        paint(w * 0.25, 10, "#e2e2dc", true); paint(w * 0.75, 10, "#e2e2dc", true);
        paint(w * 0.5 - 11, 9, "#e0b62a"); paint(w * 0.5 + 11, 9, "#e0b62a");
        // Wear: rub bits of the paint away.
        g.globalCompositeOperation = "destination-out";
        speckle(g, w, h, 14000, r, ["rgba(0,0,0,0.55)"]);
        g.globalCompositeOperation = "source-over";
      }, 1, 1);
      const groundMap = canvasTexture(512, 512, (g, w, h) => {
        const r = rng(3);
        g.fillStyle = "#9a9a9a"; g.fillRect(0, 0, w, h);
        speckle(g, w, h, 42000, r, ["#7c7c7c", "#b4b4b4", "#8c8c8c", "#c6c6c6", "#6e6e6e", "#a6a6a6"]);
        for (let i = 0; i < 2600; i++) {
          g.strokeStyle = r() > 0.5 ? "rgba(70,70,70,0.5)" : "rgba(210,210,210,0.45)";
          g.beginPath(); const x = r() * w, y = r() * h; g.moveTo(x, y); g.lineTo(x + (r() - 0.5) * 5, y - 3 - r() * 7); g.stroke();
        }
      }, 1, 1);
      const barkMap = canvasTexture(128, 256, (g, w, h) => {
        const r = rng(5);
        g.fillStyle = "#6a4a30"; g.fillRect(0, 0, w, h);
        for (let i = 0; i < 380; i++) {
          g.strokeStyle = ["#4a3220", "#7c5a3c", "#3c2818", "#8a6846"][(r() * 4) | 0];
          g.lineWidth = 1 + r() * 2;
          g.beginPath(); const x = r() * w, y = r() * h; g.moveTo(x, y); g.lineTo(x + (r() - 0.5) * 6, y + 14 + r() * 40); g.stroke();
        }
      }, 2, 2);
      const leafMap = canvasTexture(256, 256, (g, w, h) => {
        const r = rng(9);
        g.fillStyle = "#8a8a8a"; g.fillRect(0, 0, w, h);
        for (let i = 0; i < 5200; i++) {
          const v = 70 + (r() * 150) | 0;
          g.fillStyle = `rgb(${v},${v},${v})`;
          g.beginPath(); g.ellipse(r() * w, r() * h, 2 + r() * 5, 1 + r() * 2.5, r() * TAU, 0, TAU); g.fill();
        }
      }, 3, 3);

      // ------------------------------------------------------------ track
      let strips = [];        // road and ground meshes, drawn a window at a time
      let windows = [];       // instanced scenery, likewise
      let track = null;       // centreline arrays for the loaded road
      let world = null;       // everything built for it, disposed on reload
      let theme = THEMES.forest;

      function bank(f, side) {
        return theme.banks * (0.22 + 0.78 * (0.5 + 0.5 * Math.sin(f * 0.011 + side * 2.1)) * (0.5 + 0.5 * Math.sin(f * 0.0043 + side * 0.7 + 1)));
      }
      // Lateral stations beyond the road edge, in half-road-widths, and how
      // much of the embankment each carries.
      const OUT = [1, 1.12, 1.6, 2.1, 2.6, 3.4, 4.2, 5.2, 6.4];
      const RISE = [0, 0, 0.08, 0.2, 0.36, 0.56, 0.78, 1, 1.12];
      function lift(f, k, side) {
        if (RISE[k] === 0) return 0;
        const lumps = Math.sin(f * 0.23 + k * 1.9 + side) * 0.36 + Math.sin(f * 0.61 + k * 0.7) * 0.17;
        return bank(f, side) * RISE[k] + lumps * Math.min(1, RISE[k] * 2.5);
      }
      function terrain(f, x) {
        const a = Math.abs(x), side = Math.sign(x);
        if (a <= OUT[1]) return 0;
        for (let k = 1; k < OUT.length - 1; k++) {
          if (a <= OUT[k + 1]) {
            const t = (a - OUT[k]) / (OUT[k + 1] - OUT[k]);
            const lo = lift(f, k, side), hi = lift(f, k + 1, side);
            return lo + (hi - lo) * t;
          }
        }
        return lift(f, OUT.length - 1, side);
      }

      /** Position on the road at distance [z] (sim units) and lateral [x]. */
      const _p = new THREE.Vector3();
      function place(z, x, out = _p) {
        const f = Math.min(Math.max(z / 200, 0), track.n - 1.001);
        const i = Math.floor(f), t = f - i;
        const cx = track.cx[i] + (track.cx[i + 1] - track.cx[i]) * t;
        const cz = track.cz[i] + (track.cz[i + 1] - track.cz[i]) * t;
        const cy = track.cy[i] + (track.cy[i + 1] - track.cy[i]) * t;
        const th = track.th[i] + (track.th[i + 1] - track.th[i]) * t;
        // Screen-right for a camera looking along the road.
        const rx = -Math.cos(th), rz = Math.sin(th);
        out.set(cx + rx * x * HALF, cy + terrain(f, x), cz + rz * x * HALF);
        out.heading = th;
        return out;
      }

      /** The road's slope at distance [z], measured over [span], as an angle. */
      function grade(z, span) {
        const h = (d) => { const f = Math.min(Math.max(d / 200, 0), track.n - 1.001), i = Math.floor(f); return track.cy[i] + (track.cy[i + 1] - track.cy[i]) * (f - i); };
        return Math.atan2(h(z + span / 2) - h(z - span / 2), span * U);
      }

      function buildTrack(data) {
        const n = data.curves.length;
        const cx = new Float32Array(n + 1), cz = new Float32Array(n + 1), cy = new Float32Array(n + 1), th = new Float32Array(n + 1);
        for (let i = 0; i < n; i++) {
          cy[i] = data.heights[i] * U;
          // A positive curve bends right, which is a falling heading here.
          th[i + 1] = th[i] - data.curves[i] * TURN;
          cx[i + 1] = cx[i] + Math.sin(th[i]) * SEG;
          cz[i + 1] = cz[i] + Math.cos(th[i]) * SEG;
        }
        cy[n] = data.heights[n] * U;
        return { n, cx, cz, cy, th };
      }

      function buildRoad() {
        const n = track.n;
        const lat = [];
        for (let k = OUT.length - 1; k >= 0; k--) lat.push(-OUT[k]);
        for (let k = 0; k < OUT.length; k++) lat.push(OUT[k]);
        const cols = lat.length;
        const pos = new Float32Array((n + 1) * cols * 3), uv = new Float32Array((n + 1) * cols * 2), col = new Float32Array((n + 1) * cols * 3);
        const tmp = new THREE.Color();
        const r = rng(21);
        for (let i = 0; i <= n; i++) {
          for (let c = 0; c < cols; c++) {
            const o = (i * cols + c);
            place(i * 200, lat[c]);
            pos[o * 3] = _p.x; pos[o * 3 + 1] = _p.y; pos[o * 3 + 2] = _p.z;
            uv[o * 2] = lat[c] * HALF / 3.2; uv[o * 2 + 1] = i * SEG / 3.2;
            const edge = Math.abs(lat[c]) <= 1.13;
            // The scan carries the detail; vertex colour only steers its tone,
            // browner along the verge.
            tmp.set(theme.wash).multiplyScalar(0.86 + r() * 0.26);
            if (edge) tmp.set(0xffffff).multiplyScalar(0.84 + r() * 0.24);
            col[o * 3] = tmp.r; col[o * 3 + 1] = tmp.g; col[o * 3 + 2] = tmp.b;
          }
        }
        const idx = [], vergeIdx = [];
        const mid = OUT.length - 1;   // the strip between the two road edges is the tarmac
        for (let i = 0; i < n; i++) {
          for (let c = 0; c < cols - 1; c++) {
            if (c === mid) continue;
            const a = i * cols + c, b = a + 1, d = a + cols, e = d + 1;
            // The two strips either side of the tarmac are bare dirt.
            const verge = Math.abs(c - mid) <= 2 && c !== mid;
            (verge ? vergeIdx : idx).push(a, b, d, b, e, d);
          }
        }
        const ground = new THREE.BufferGeometry();
        ground.setAttribute("position", new THREE.BufferAttribute(pos, 3));
        ground.setAttribute("uv", new THREE.BufferAttribute(uv, 2));
        ground.setAttribute("color", new THREE.BufferAttribute(col, 3));
        ground.setIndex(idx);
        ground.computeVertexNormals();
        const groundMesh = new THREE.Mesh(ground, new THREE.MeshStandardMaterial({ ...scan(theme.ground), vertexColors: true }));
        groundMesh.receiveShadow = true;
        groundMesh.frustumCulled = false;
        groundMesh.userData.perRow = (cols - 6) * 6;
        // The verge shares the ground's vertices but wears its own surface.
        const vergeGeo = new THREE.BufferGeometry();
        for (const name of ["position", "uv", "color"]) vergeGeo.setAttribute(name, ground.attributes[name]);
        vergeGeo.setIndex(vergeIdx);
        // Its own normals: the vertices on the road's edge belong to no
        // ground triangle, so the ground's normals there are empty.
        vergeGeo.computeVertexNormals();
        const vergeMesh = new THREE.Mesh(vergeGeo, new THREE.MeshStandardMaterial({ ...scan("dirt_floor"), vertexColors: true }));
        vergeMesh.receiveShadow = true;
        vergeMesh.frustumCulled = false;
        vergeMesh.userData.perRow = 4 * 6;

        // Tarmac: its own strip so the markings map cleanly across it.
        const rp = new Float32Array((n + 1) * 2 * 3), ru = new Float32Array((n + 1) * 2 * 2), ri = [];
        for (let i = 0; i <= n; i++) {
          for (let s = 0; s < 2; s++) {
            place(i * 200, s ? 1 : -1);
            const o = i * 2 + s;
            rp[o * 3] = _p.x; rp[o * 3 + 1] = _p.y + 0.02; rp[o * 3 + 2] = _p.z;
            ru[o * 2] = s; ru[o * 2 + 1] = i / 12;
            // The roughness and normal maps tile by their own repeat.
          }
          if (i < n) { const a = i * 2; ri.push(a, a + 1, a + 2, a + 1, a + 3, a + 2); }
        }
        const road = new THREE.BufferGeometry();
        road.setAttribute("position", new THREE.BufferAttribute(rp, 3));
        road.setAttribute("uv", new THREE.BufferAttribute(ru, 2));
        road.setIndex(ri);
        road.computeVertexNormals();
        const roadMesh = new THREE.Mesh(road, new THREE.MeshStandardMaterial({ ...scan("asphalt_track", 5, 2), color: 0xb8b8bc, envMapIntensity: 1.25 }));
        const lines = new THREE.Mesh(road, new THREE.MeshStandardMaterial({ map: roadMap, transparent: true, roughness: 0.6, metalness: 0, polygonOffset: true, polygonOffsetFactor: -2, polygonOffsetUnits: -2 }));
        lines.receiveShadow = true; lines.frustumCulled = false; lines.userData.perRow = 6;
        roadMesh.receiveShadow = true;
        roadMesh.frustumCulled = false;
        roadMesh.userData.perRow = 6;
        strips = [groundMesh, vergeMesh, roadMesh, lines];
        return [groundMesh, vergeMesh, roadMesh, lines];
      }

      // ---------------------------------------------------------- scenery
      const tint = (hex) => sway(leafy(new THREE.MeshStandardMaterial({ map: leafMap, color: hex, roughness: 0.9 })), 0.012);
      const MAT = {
        bark: new THREE.MeshStandardMaterial({ ...scan("bark_brown_02", 2, 3) }),
        pine: tint(0x2f6a3a), oak: tint(0x5a9a3e), palm: tint(0x5c9c44), cactus: tint(0x4a8a44),
        rock: new THREE.MeshStandardMaterial({ map: groundMap, color: 0x8c8a84, roughness: 0.95 }),
        metal: new THREE.MeshStandardMaterial({ color: 0xb8bcc4, roughness: 0.35, metalness: 0.9 }),
        wood: new THREE.MeshStandardMaterial({ map: barkMap, color: 0xd8cdb8, roughness: 0.9 }),
        barn: new THREE.MeshStandardMaterial({ map: barkMap, color: 0xc0463a, roughness: 0.9 }),
        roof: new THREE.MeshStandardMaterial({ color: 0x4c4642, roughness: 0.6, metalness: 0.4 }),
      };
      function merge(parts) {
        // Bakes each part's transform and joins them into one geometry.
        let count = 0;
        for (const [g] of parts) count += g.toNonIndexed ? (g.index ? g.index.count : g.attributes.position.count) : 0;
        const pos = [], nor = [], uv = [];
        for (const [g, m] of parts) {
          const flat = g.index ? g.toNonIndexed() : g;
          if (m) flat.applyMatrix4(m);
          pos.push(...flat.attributes.position.array); nor.push(...flat.attributes.normal.array); uv.push(...flat.attributes.uv.array);
        }
        const out = new THREE.BufferGeometry();
        out.setAttribute("position", new THREE.Float32BufferAttribute(pos, 3));
        out.setAttribute("normal", new THREE.Float32BufferAttribute(nor, 3));
        out.setAttribute("uv", new THREE.Float32BufferAttribute(uv, 2));
        return out;
      }
      const at = (x, y, z, sx = 1, sy = 1, sz = 1, rx = 0, rz = 0) =>
        new THREE.Matrix4().compose(new THREE.Vector3(x, y, z), new THREE.Quaternion().setFromEuler(new THREE.Euler(rx, 0, rz)), new THREE.Vector3(sx, sy, sz));
      /** A sphere pushed about so it reads as a clump, not a ball. */
      function clump(radius, seed, detail = 3) {
        const g = new THREE.IcosahedronGeometry(radius, detail);

        apply({
          pz: d.z, px: 0.5 + Math.sin(clock * 0.2) * 0.2, lean: track.curve[i] * 0.16, crash: 0, crashAge: 0, riderOffset: 0, chase: true,
          riders: d.pack.map((r, id) => ({ id, x: r.x + Math.sin(clock * 0.5 + r.sway) * 0.05, z: r.z, lean: track.curve[Math.floor(r.z / 200)] * 0.16, pose: 0, down: false, look: r.look })),
          cars: d.cars.map((c, id) => ({ id, ...c })).filter((c) => c.z > d.z - 3000 && c.z < d.z + 90000 && c.z < end).map((c) => ({ id: c.id, x: c.x, z: c.z, look: c.look, oncoming: c.x < 0 })),
        });
      }

      // ------------------------------------------------------------- shop
      // The bike shop: one bike at a time on a turntable in a showroom,
      // stood to the right so the list of bikes has the left of the screen.
      const SHOP_PAINT = [0x9aa4b0, 0x2f6fd0, 0xd8a020, 0x1f9a58, 0xd03a2a, 0x18181c];
      const shop = (() => {
        const room = new THREE.Scene();
        room.background = new THREE.Color(0x0b0910);
        room.add(new THREE.HemisphereLight(0xdfe8ff, 0x30283a, 0.9));
        const key = new THREE.DirectionalLight(0xfff2dc, 2.8); key.position.set(3, 5, 4); room.add(key);
        const rim = new THREE.DirectionalLight(0x88aaff, 1.4); rim.position.set(-4, 3, -3); room.add(rim);
        const floor = new THREE.Mesh(new THREE.CircleGeometry(10, 48).rotateX(-Math.PI / 2), new THREE.MeshStandardMaterial({ color: 0x1c1a22, roughness: 0.22, metalness: 0.65 }));
        const plinth = new THREE.Mesh(new THREE.CylinderGeometry(1.5, 1.6, 0.14, 48), new THREE.MeshStandardMaterial({ color: 0x2c2a34, roughness: 0.35, metalness: 0.7 }));
        plinth.position.y = 0.07;
        const ring = new THREE.Mesh(new THREE.TorusGeometry(1.52, 0.02, 8, 64).rotateX(Math.PI / 2), new THREE.MeshBasicMaterial({ color: 0xf07020 }));
        ring.position.y = 0.145;
        const sign = new THREE.CanvasTexture((() => {
          const c = document.createElement("canvas"); c.width = 1024; c.height = 384;
          const g = c.getContext("2d");
          g.fillStyle = "#15121c"; g.fillRect(0, 0, 1024, 384);
          g.strokeStyle = "#262230"; g.lineWidth = 4;
          for (let x = 0; x <= 1024; x += 128) { g.beginPath(); g.moveTo(x, 0); g.lineTo(x, 384); g.stroke(); }
          g.fillStyle = "#f07020"; g.font = "900 120px Arial"; g.textAlign = "center"; g.fillText("BIKE SHOP", 512, 290);
          g.fillStyle = "#f0e8b8"; g.font = "700 40px Arial"; g.fillText("RIDE IT HOME TODAY", 512, 345);
          return c;
        })());
        sign.colorSpace = THREE.SRGBColorSpace;
        const wall = new THREE.Mesh(new THREE.PlaneGeometry(16, 6), new THREE.MeshStandardMaterial({ map: sign, roughness: 0.85 }));
        wall.position.set(0, 3, -4.5);
        const stand = new THREE.Group(); stand.position.y = 0.14;
        room.add(floor, plinth, ring, wall, stand);
        const cam = new THREE.PerspectiveCamera(38, 1, 0.1, 60);
        cam.position.set(-0.6, 1.3, 4.7); cam.lookAt(-1.15, 0.62, 0);
        return { room, stand, cam, shown: -1, back: "idle" };
      })();
      /** Puts bike [index] on show; a negative index leaves the shop. */
      async function showBike(index) {
        if (index < 0) { if (mode === "shop") mode = shop.back; return; }
        if (mode !== "shop") shop.back = mode;
        mode = "shop";
        if (shop.shown === index) return;
        shop.shown = index;
        await downloads;
        if (shop.shown !== index) return;
        shop.stand.clear();
        const hue = SHOP_PAINT[index % SHOP_PAINT.length];
        let bike;
        if (bikeHi) {
          bike = bikeHi.clone(true);
          bike.traverse((o) => { if (o.isMesh && /paintRed|carpaint/i.test(o.material.name)) { o.material = o.material.clone(); o.material.color.set(hue); } });
        } else {
          bike = makeBike(hue);
        }
        // Dearer bikes are bigger machines.
        bike.scale.multiplyScalar(0.94 + index * 0.025);
        shop.stand.add(bike);
      }

      // ------------------------------------------------------ engine note
      // Two loops cut from one recording of a sport bike, low revs and high,
      // both playing all the time: the revs set their pitch and how much of
      // each is heard, so the note climbs without a seam or a step.
      const audio = { ctx: null, on: false, master: null, parts: [] };
      async function startAudio() {
        const ctx = (audio.ctx = new (window.AudioContext || window.webkitAudioContext)());
        audio.master = ctx.createGain(); audio.master.gain.value = 0; audio.master.connect(ctx.destination);
        for (const [file, base] of [["engine_low.wav", 95], ["engine_high.wav", 150]]) {
          const buffer = await ctx.decodeAudioData(await (await fetch(file)).arrayBuffer());
          const src = ctx.createBufferSource(); src.buffer = buffer; src.loop = true;
          const gain = ctx.createGain(); gain.gain.value = 0;
          src.connect(gain); gain.connect(audio.master); src.start();
          audio.parts.push({ src, gain, base });
        }
        audio.master.gain.value = audio.on ? 1 : 0;
        window.flutter_inappwebview?.callHandler?.("rrAudio", ctx.state, audio.parts.length);
      }
      function sound(on) {
        audio.on = !!on;
        if (on && !audio.ctx) startAudio().catch((e) => { console.warn("Road Rumble engine sound failed", e); window.flutter_inappwebview?.callHandler?.("rrAudio", `failed: ${e}`, 0); });
        if (!audio.ctx || !audio.master) return;
        if (on) audio.ctx.resume();
        audio.master.gain.setTargetAtTime(on ? 1 : 0, audio.ctx.currentTime, 0.04);
      }
      /** [revs] 0 at idle to 1 at the red line; [volume] 0 to 1. */
      function rev(revs, volume) {
        if (!audio.parts.length) return;
        if (audio.on && audio.ctx.state !== "running") audio.ctx.resume();
        const t = audio.ctx.currentTime, hz = 74 + 116 * revs, high = Math.min(1, Math.max(0, (hz - 102) / 40));
        audio.parts.forEach((part, i) => {
          part.src.playbackRate.setTargetAtTime(hz / part.base, t, 0.05);
          part.gain.gain.setTargetAtTime(volume * Math.sqrt(i ? high : 1 - high), t, 0.05);
        });
      }

      // -------------------------------------------------------------- api
      /** Unpacks the flat array the Flutter side sends, some thirty times a
       *  second, stamped with the simulation's clock. */
      let before = null, base = null;
      function frame(a) {
        if (!track || mode !== "race") return;
        let k = 0;
        const s = { t: a[k++], pz: a[k++], px: a[k++], lean: a[k++], crash: a[k++], crashAge: a[k++], riderOffset: a[k++], pose: a[k++], revs: a[k++], volume: a[k++], chase: !COCKPIT, riders: [], cars: [], riderAt: new Map(), carAt: new Map() };
        const riderCount = a[k++];
        for (let i = 0; i < riderCount; i++) { const r = { id: a[k++], x: a[k++], z: a[k++], lean: a[k++], pose: a[k++], down: a[k++] > 0, look: a[k++] }; s.riders.push(r); s.riderAt.set(r.id, r); }
        const carCount = a[k++];
        for (let i = 0; i < carCount; i++) { const c = { id: a[k++], x: a[k++], z: a[k++], look: a[k++], oncoming: a[k++] > 0 }; s.cars.push(c); s.carAt.set(c.id, c); }
        // Where the simulation's clock sits against this page's, eased so
        // that frames arriving early or late don't jolt it.
        const sample = performance.now() - s.t * 1000;
        base = base === null || Math.abs(sample - base) > 150 ? sample : base + (sample - base) * 0.05;
        before = state;
        state = s;
        rev(s.revs, s.volume);
      }
      /** The newest frame carried forward to [now] at the speed everything
       *  was last moving, so motion is even however unevenly frames arrive. */
      function predict(now) {
        const s = state, p = before;
        const gap = p ? s.t - p.t : 0;
        if (gap <= 0 || gap > 0.25 || s.crash !== p.crash) return s;
        const k = Math.min(0.1, Math.max(0, (now - base) / 1000 - s.t)) / gap;
        const on = (was, is) => is + (is - was) * k;
        return {
          ...s, pz: on(p.pz, s.pz), px: on(p.px, s.px), lean: on(p.lean, s.lean),
          riders: s.riders.map((r) => { const q = p.riderAt.get(r.id); return q ? { ...r, x: on(q.x, r.x), z: on(q.z, r.z), lean: on(q.lean, r.lean) } : r; }),
          cars: s.cars.map((c) => { const q = p.carAt.get(c.id); return q ? { ...c, x: on(q.x, c.x), z: on(q.z, c.z) } : c; }),
        };
      }
      window.RR = { load, frame, attract, ready, sound, shop: showBike, idle: () => { if (mode !== "attract" && !(mode === "shop" && shop.back === "attract")) attract(); }, stats: () => ({ calls: renderer.info.render.calls, triangles: renderer.info.render.triangles }) };

      // Quality steps down by itself when frames come slowly, one notch at a
      // time, and never back up within a session (that would see-saw).
      const quality = { tier: 0, grass: true };
      const STEPS = PHONE ? [
        () => { renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 1.6)); resize(); },
        () => { quality.grass = false; for (const w of windows) if (w.grass) for (const im of w.meshes) im.visible = false; },
        () => { renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 1.25)); resize(); },
        () => { renderer.setPixelRatio(1); resize(); },
      ] : [
        () => { quality.grass = false; for (const w of windows) if (w.grass) for (const im of w.meshes) im.visible = false; },
        () => { renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 1.25)); resize(); },
        () => { renderer.shadowMap.enabled = false; sun.castShadow = false; scene.traverse((o) => { if (o.material) [].concat(o.material).forEach((m) => (m.needsUpdate = true)); }); },
        () => { renderer.setPixelRatio(1); resize(); },
      ];
      // The app remembers the step this phone settled on, so a race doesn't
      // open at a quality it is known not to hold.
      for (const known = Math.min(STEPS.length, +new URLSearchParams(location.search).get("tier") || 0); quality.tier < known;) STEPS[quality.tier++]();
      let frames = 0, span = 0, settle = 3;
      function watchSpeed(dt) {
        // Loading and the first seconds of a scene don't count.
        if (settle > 0) { settle -= dt; return; }
        frames++; span += dt;
        if (span < 1.5) return;
        const fps = frames / span;
        frames = 0; span = 0;
        if (fps < 44 && quality.tier < STEPS.length) { STEPS[quality.tier++](); settle = 1.5; }
        window.flutter_inappwebview?.callHandler?.("rrStats", Math.round(fps), quality.tier, renderer.info.render.triangles);
      }

      let last = performance.now();
      function tick(now) {
        const dt = Math.min(0.05, (now - last) / 1000);
        last = now; clock += dt; DT = dt || 1 / 60;
        stepDust(dt);
        if (mode === "shop") {
          shop.stand.rotation.y += dt * 0.55;
          shop.room.environment = scene.environment;
          if (shop.cam.aspect !== camera.aspect) { shop.cam.aspect = camera.aspect; shop.cam.updateProjectionMatrix(); }
          renderer.render(shop.room, shop.cam);
        } else if (track) {
          if (mode === "attract" && demo) stepDemo(dt);
          else if (mode === "race" && state) apply(predict(now));
          wind.value = clock;
          renderer.render(scene, camera);
          watchSpeed(dt);
        }
        requestAnimationFrame(tick);
      }
      requestAnimationFrame(tick);

      // On its own, or until the app says otherwise, fly along a demo road.
      const wanted = new URLSearchParams(location.search).get("theme");
      attract(wanted || undefined).then(() => window.flutter_inappwebview?.callHandler?.("rrReady"));
    </script>
  </body>
</html>
